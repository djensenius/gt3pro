name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
      - name: Build iOS App
        run: |
          xcodebuild build \
            -project GT3Companion.xcodeproj \
            -scheme "GT3Companion" \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=YES \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO
