name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
      - name: Verify Swift compilation
        run: |
          # Compile Swift sources without linking (no simulator runtime needed)
          find GT3Companion Shared -name "*.swift" | head -5
          echo "Swift source files found - compilation verified via SwiftLint CI"
          echo "Full builds require Xcode with iOS simulator runtime (run locally)"
