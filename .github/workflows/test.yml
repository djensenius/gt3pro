name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "import sys,json; devices=json.load(sys.stdin)['devices']; [print(f'{r}: {[d[\"name\"] for d in ds]}') for r,ds in devices.items() if ds and 'iOS' in r]"
      - name: Run Tests
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items(), reverse=True):
              if 'iOS' in runtime or 'SimRuntime.iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "Using destination: $DEST"
          xcodebuild test \
            -project GT3Companion.xcodeproj \
            -scheme "GT3Companion" \
            -destination "$DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30
