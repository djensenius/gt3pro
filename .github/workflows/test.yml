name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
      - name: Install simulator runtimes
        run: |
          xcodebuild -downloadPlatform watchOS
          xcodebuild -downloadPlatform iOS
      - name: Run Tests
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items(), reverse=True):
              if 'iOS' in runtime or 'SimRuntime.iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "Testing with destination: $DEST"
          xcodebuild test \
            -project GT3Companion.xcodeproj \
            -scheme "GT3Companion" \
            -destination "$DEST" \
            -configuration Debug \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_ARCHS=x86_64
