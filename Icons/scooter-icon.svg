<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background: Catppuccin Latte Base #eff1f5 -->
  <rect width="1024" height="1024" rx="224" fill="#eff1f5"/>
  
  <!-- Sumi-e brush stroke scooter silhouette -->
  <g transform="translate(512, 520) scale(1.0)" fill="none" stroke="#1e1e2e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back wheel -->
    <circle cx="-180" cy="140" r="72" stroke-width="18" opacity="0.9"/>
    <circle cx="-180" cy="140" r="8" fill="#1e1e2e" stroke="none"/>
    
    <!-- Front wheel -->
    <circle cx="200" cy="140" r="72" stroke-width="18" opacity="0.9"/>
    <circle cx="200" cy="140" r="8" fill="#1e1e2e" stroke="none"/>
    
    <!-- Deck/footboard - thick brush stroke -->
    <path d="M -140 120 Q -40 105 60 108 Q 130 110 180 115" stroke-width="26" opacity="0.85"/>
    
    <!-- Stem - vertical brush stroke with slight curve -->
    <path d="M 160 110 Q 175 20 185 -60 Q 190 -120 200 -180" stroke-width="22" opacity="0.9"/>
    
    <!-- Handlebars - horizontal brush stroke -->
    <path d="M 140 -180 Q 170 -195 200 -190 Q 230 -185 260 -175" stroke-width="20" opacity="0.85"/>
    
    <!-- Handlebar grips -->
    <circle cx="138" cy="-178" r="12" fill="#1e1e2e" stroke="none" opacity="0.7"/>
    <circle cx="262" cy="-173" r="12" fill="#1e1e2e" stroke="none" opacity="0.7"/>
    
    <!-- Rear fender - brush arc -->
    <path d="M -215 80 Q -250 120 -250 150 Q -248 185 -215 200" stroke-width="14" opacity="0.7"/>
    
    <!-- Body/frame connection - brush stroke -->
    <path d="M -110 108 Q -90 40 -20 -20 Q 40 -60 130 -30" stroke-width="16" opacity="0.6"/>
    
    <!-- Subtle ink splatter accents -->
    <circle cx="-60" cy="170" r="4" fill="#1e1e2e" opacity="0.3"/>
    <circle cx="30" cy="175" r="3" fill="#1e1e2e" opacity="0.25"/>
    <circle cx="100" cy="168" r="5" fill="#1e1e2e" opacity="0.2"/>
  </g>
</svg>
