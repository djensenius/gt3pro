name: ScooterCompanion
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "202607091225"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ScooterCompanion:
    type: application
    platform: iOS
    sources:
      - path: ScooterCompanion
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: ScooterCompanion/Info.plist
      properties:
        CFBundleDisplayName: Scooter Companion
        CFBundleName: ScooterCompanion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: Scooter Companion connects to your scooter to read ride telemetry and sync data.
        NSBluetoothPeripheralUsageDescription: Scooter Companion needs Bluetooth to communicate with your scooter.
        NSLocationWhenInUseUsageDescription: Scooter Companion records your GPS route during rides.
        NSLocationAlwaysAndWhenInUseUsageDescription: Scooter Companion needs background location to track rides when your phone is in your pocket.
        NSMotionUsageDescription: Scooter Companion uses motion sensors to detect road surface quality.
        NSHealthShareUsageDescription: Scooter Companion reads heart rate data from your Apple Watch during rides.
        NSHealthUpdateUsageDescription: Scooter Companion saves ride workouts to Apple Health.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.travel
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: ScooterCompanion/ScooterCompanion.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
    dependencies:
      - target: ScooterCompanionWidgets
        embed: true
      - target: ScooterCompanionWatch
        embed: true
        codeSign: true

  ScooterCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ScooterCompanionWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: ScooterCompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scooter Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false

  ScooterCompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: ScooterCompanionWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
        includes:
          - BatteryIcon.swift
          - Theme.swift
          - WeatherSnapshot.swift
    info:
      path: ScooterCompanionWatch/Info.plist
      properties:
        CFBundleDisplayName: Scooter Companion
        CFBundleName: ScooterCompanionWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.davidjensenius.GT3Companion
        WKSupportsLiveActivities: true
        NSHealthShareUsageDescription: Scooter Companion reads your heart rate during scooter rides.
        NSHealthUpdateUsageDescription: Scooter Companion saves scooter ride workouts to Apple Health.
        WKBackgroundModes:
          - workout-processing
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.watch
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: ScooterCompanionWatch/ScooterCompanionWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  ScooterCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScooterCompanionTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ScooterCompanion
        embed: false

  ScooterCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScooterCompanionUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ScooterCompanion
        embed: false

  ScooterCompanionMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScooterCompanionMacTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests.mac
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ScooterCompanionMac
        embed: false

  ScooterCompanionVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: ScooterCompanionVisionTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests.vision
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ScooterCompanionVision
        embed: false

  ScooterCompanionWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: ScooterCompanionWatchTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.watch.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ScooterCompanionWatch
        embed: false

  ScooterCompanionMac:
    type: application
    platform: macOS
    sources:
      - path: ScooterCompanionMac
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: ScooterCompanion/Views/AggregateAnalyticsView.swift
      - path: ScooterCompanion/Views/ScooterInfoView.swift
      - path: ScooterCompanion/Views/Components/InfoRow.swift
    info:
      path: ScooterCompanionMac/Info.plist
      properties:
        CFBundleDisplayName: Scooter Companion
        CFBundleName: ScooterCompanion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.travel
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        ENABLE_INCOMING_NETWORK_CONNECTIONS: false
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: ScooterCompanionMac/ScooterCompanionMac.entitlements

  ScooterCompanionVision:
    type: application
    platform: visionOS
    sources:
      - path: ScooterCompanionVision
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: ScooterCompanion/Views/AggregateAnalyticsView.swift
      - path: ScooterCompanion/Views/ScooterInfoView.swift
      - path: ScooterCompanion/Views/Components/InfoRow.swift
    info:
      path: ScooterCompanionVision/Info.plist
      properties:
        CFBundleDisplayName: Scooter Companion
        CFBundleName: ScooterCompanionVision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  ScooterCompanion:
    build:
      targets:
        ScooterCompanionWatch: all
        ScooterCompanion: all
        ScooterCompanionWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionTests
        - ScooterCompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug

  ScooterCompanionCI:
