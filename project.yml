    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionTests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionMac:
    build:
      targets:
        ScooterCompanionMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionMacTests
    profile:
      config: Release
