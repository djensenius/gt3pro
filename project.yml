      config: Debug

  ScooterCompanionWatch:
    build:
      targets:
        ScooterCompanionWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionWatchTests
    profile:
      config: Release
    analyze:
      config: Debug

  ScooterCompanionVision:
    build:
      targets:
        ScooterCompanionVision: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionVisionTests
    profile:
      config: Release
    analyze:
      config: Debug

  # Compatibility aliases for existing Xcode Cloud workflows.
  GT3Companion:
    build:
      targets:
        ScooterCompanionWatch: all
