      targets:
        - ScooterCompanionTests
    profile:
      config: Release
    analyze:
      config: Debug

  ScooterCompanionMac:
    build:
      targets:
        ScooterCompanionMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScooterCompanionMacTests
    profile:
      config: Release
