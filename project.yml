name: GT3Companion
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
    macOS: "15.0"
    visionOS: "2.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "202604111126"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  GT3Companion:
    type: application
    platform: iOS
    sources:
      - path: GT3Companion
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: GT3Companion/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3Companion
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: GT3 Companion connects to your Segway GT3 Pro to read ride telemetry and sync data.
        NSBluetoothPeripheralUsageDescription: GT3 Companion needs Bluetooth to communicate with your Segway GT3 Pro.
        NSLocationWhenInUseUsageDescription: GT3 Companion records your GPS route during rides.
        NSLocationAlwaysAndWhenInUseUsageDescription: GT3 Companion needs background location to track rides when your phone is in your pocket.
        NSMotionUsageDescription: GT3 Companion uses motion sensors to detect road surface quality.
        NSHealthShareUsageDescription: GT3 Companion reads heart rate data from your Apple Watch during rides.
        NSHealthUpdateUsageDescription: GT3 Companion saves ride workouts to Apple Health.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        ITSAppUsesNonExemptEncryption: false
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    entitlements:
      path: GT3Companion/GT3Companion.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
    dependencies:
      - target: GT3CompanionWidgets
        embed: true
    postBuildScripts:
      - name: "Embed Watch App"
        script: |
          WATCH_APP="${BUILT_PRODUCTS_DIR}/GT3CompanionWatch.app"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Watch"
          if [ -d "$WATCH_APP" ]; then
            mkdir -p "$DEST"
            ditto "$WATCH_APP" "$DEST/GT3CompanionWatch.app"
            echo "Embedded Watch app from $WATCH_APP"
          else
            echo "Watch app not found at $WATCH_APP — skipping embed"
          fi
        basedOnDependencyAnalysis: false

  GT3CompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GT3CompanionWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: GT3CompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: GT3 Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false

  GT3CompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: GT3CompanionWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
        includes:
          - BatteryIcon.swift
          - Theme.swift
          - WeatherSnapshot.swift
    info:
      path: GT3CompanionWatch/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionWatch
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.davidjensenius.GT3Companion
        NSHealthShareUsageDescription: GT3 Companion reads your heart rate during scooter rides.
        NSHealthUpdateUsageDescription: GT3 Companion saves scooter ride workouts to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.watch
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: GT3CompanionWatch/GT3CompanionWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  GT3CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GT3CompanionTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3Companion
        embed: false

  GT3CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GT3CompanionUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3Companion
        embed: false

  GT3CompanionMac:
    type: application
    platform: macOS
    sources:
      - path: GT3CompanionMac
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: GT3Companion/Views/AggregateAnalyticsView.swift
      - path: GT3Companion/Views/ScooterInfoView.swift
      - path: GT3Companion/Views/Components/InfoRow.swift
    info:
      path: GT3CompanionMac/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionMac
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.mac
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle

  GT3CompanionVision:
    type: application
    platform: visionOS
    sources:
      - path: GT3CompanionVision
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: GT3Companion/Views/AggregateAnalyticsView.swift
      - path: GT3Companion/Views/ScooterInfoView.swift
      - path: GT3Companion/Views/Components/InfoRow.swift
    info:
      path: GT3CompanionVision/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionVision
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.vision
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  GT3Companion:
    build:
      targets:
        GT3CompanionWatch: all
        GT3Companion: all
        GT3CompanionWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionTests
        - GT3CompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionCI:
    build:
      targets:
        GT3Companion: all
        GT3CompanionWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionTests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionMac:
    build:
      targets:
        GT3CompanionMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionWatch:
    build:
      targets:
        GT3CompanionWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionVision:
    build:
      targets:
        GT3CompanionVision: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
