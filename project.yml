name: GT3Companion
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "202607091225"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  GT3Companion:
    type: application
    platform: iOS
    sources:
      - path: GT3Companion
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: GT3Companion/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: GT3 Companion connects to your Segway GT3 Pro to read ride telemetry and sync data.
        NSBluetoothPeripheralUsageDescription: GT3 Companion needs Bluetooth to communicate with your Segway GT3 Pro.
        NSLocationWhenInUseUsageDescription: GT3 Companion records your GPS route during rides.
        NSLocationAlwaysAndWhenInUseUsageDescription: GT3 Companion needs background location to track rides when your phone is in your pocket.
        NSMotionUsageDescription: GT3 Companion uses motion sensors to detect road surface quality.
        NSHealthShareUsageDescription: GT3 Companion reads heart rate data from your Apple Watch during rides.
        NSHealthUpdateUsageDescription: GT3 Companion saves ride workouts to Apple Health.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.travel
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: GT3Companion/GT3Companion.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
    dependencies:
      - target: GT3CompanionWidgets
        embed: true
      - target: GT3CompanionWatch
        embed: true
        codeSign: true

  GT3CompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GT3CompanionWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: GT3CompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: GT3 Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false

  GT3CompanionWatch:
    type: application
    platform: watchOS
    sources:
      - path: GT3CompanionWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
        includes:
          - BatteryIcon.swift
          - Theme.swift
          - WeatherSnapshot.swift
    info:
      path: GT3CompanionWatch/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.davidjensenius.GT3Companion
        WKSupportsLiveActivities: true
        NSHealthShareUsageDescription: GT3 Companion reads your heart rate during scooter rides.
        NSHealthUpdateUsageDescription: GT3 Companion saves scooter ride workouts to Apple Health.
        WKBackgroundModes:
          - workout-processing
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.watch
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: GT3CompanionWatch/GT3CompanionWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  GT3CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GT3CompanionTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3Companion
        embed: false

  GT3CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GT3CompanionUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3Companion
        embed: false

  GT3CompanionMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GT3CompanionMacTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests.mac
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3CompanionMac
        embed: false

  GT3CompanionVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: GT3CompanionVisionTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.tests.vision
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3CompanionVision
        embed: false

  GT3CompanionWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: GT3CompanionWatchTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion.watch.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: GT3CompanionWatch
        embed: false

  GT3CompanionMac:
    type: application
    platform: macOS
    sources:
      - path: GT3CompanionMac
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: GT3Companion/Views/AggregateAnalyticsView.swift
      - path: GT3Companion/Views/ScooterInfoView.swift
      - path: GT3Companion/Views/Components/InfoRow.swift
    info:
      path: GT3CompanionMac/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionMac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.travel
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        ENABLE_INCOMING_NETWORK_CONNECTIONS: false
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: GT3CompanionMac/GT3CompanionMac.entitlements

  GT3CompanionVision:
    type: application
    platform: visionOS
    sources:
      - path: GT3CompanionVision
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      - path: GT3Companion/Views/AggregateAnalyticsView.swift
      - path: GT3Companion/Views/ScooterInfoView.swift
      - path: GT3Companion/Views/Components/InfoRow.swift
    info:
      path: GT3CompanionVision/Info.plist
      properties:
        CFBundleDisplayName: GT3 Companion
        CFBundleName: GT3CompanionVision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - gt3companion
        OIDCIssuerBase: https://auth.fluxhaus.io/application/o/gt3-companion
        OIDCClientID: gcQHXtphJwbyF6az9rMLavWOqR1vrQqq12t6cjvH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.GT3Companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  GT3Companion:
    build:
      targets:
        GT3CompanionWatch: all
        GT3Companion: all
        GT3CompanionWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionTests
        - GT3CompanionUITests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionCI:
    build:
      targets:
        GT3Companion: all
        GT3CompanionWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionTests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionMac:
    build:
      targets:
        GT3CompanionMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionMacTests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionWatch:
    build:
      targets:
        GT3CompanionWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionWatchTests
    profile:
      config: Release
    analyze:
      config: Debug

  GT3CompanionVision:
    build:
      targets:
        GT3CompanionVision: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GT3CompanionVisionTests
    profile:
      config: Release
    analyze:
      config: Debug
